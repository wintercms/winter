name: Module sub-split

on:
  push:
    # Branches only. Tag pushes are handled by the `create` event below; without
    # this filter they would also fire here and pass the tag name to `split -b`,
    # which then fails looking for a branch that doesn't exist.
    branches:
      - "**"
  create:
  delete:

jobs:
    split:
        name: Sub-split
        runs-on: ubuntu-latest
        container: wintercms/cli:0.3.4
        # This job never checks the repository out, so it needs no `GITHUB_TOKEN` at all.
        # Without this block it inherits the repository-wide default, which hands the job
        # write access to this repository alongside the split token.
        permissions: {}
        env:
            WINTER_CLI_GITHUB_TOKEN: ${{ secrets.WINTER_SPLIT_TOKEN }}
        steps:
            # Ref names are attacker-chosen text, so they are bound to the environment and
            # referenced as quoted shell variables rather than interpolated into `run:`.
            # A `${{ }}` expression is substituted textually before any shell exists, and
            # git permits `$`, backtick, `;` and `"` in a ref name, so the ref would
            # otherwise be parsed as shell syntax in a step that holds the split token.
            - name: Create tag
              if: github.event_name == 'create' && github.ref_type == 'tag'
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: winter split -a "$REF_NAME"
            - name: Delete branch
              if: github.event_name == 'delete' && github.ref_type == 'branch'
              env:
                  REF_NAME: ${{ github.event.ref }}
              run: winter split --remove-branch="$REF_NAME"
            - name: Delete tag
              if: github.event_name == 'delete' && github.ref_type == 'tag'
              env:
                  REF_NAME: ${{ github.event.ref }}
              run: winter split --remove-tag="$REF_NAME"
            - name: Push
              if: github.event_name == 'push'
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: winter split -b "$REF_NAME"
